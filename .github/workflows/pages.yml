# Builds the site and publishes it to GitHub Pages as a preview.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [claude/coofly-website-redesign-csp15q, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # Adds noindex so the preview does not compete with coolflyaircraft.com in search.
          SITE_PREVIEW: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
